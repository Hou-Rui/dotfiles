<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Step 1: Define monospace alias -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IosevkaCustom Nerd Font</family>
    </prefer>
  </alias>

  <!-- Step 2: Map medium weight to regular -->
  <match target="font">
    <test name="family" compare="eq">
      <string>IosevkaCustom Nerd Font</string>
    </test>
    <test name="weight" compare="eq">
      <const>medium</const>
    </test>
    <edit name="weight" mode="assign">
      <const>regular</const>
    </edit>
  </match>

  <!-- Step 3: Map black weight to bold -->
  <match target="font">
    <test name="family" compare="eq">
      <string>IosevkaCustom Nerd Font</string>
    </test>
    <test name="weight" compare="eq">
      <const>black</const>
    </test>
    <edit name="weight" mode="assign">
      <const>bold</const>
    </edit>
  </match>

</fontconfig>

