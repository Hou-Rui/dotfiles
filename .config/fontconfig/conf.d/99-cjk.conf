<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Prefer HarmonyOS Sans SC for CJK glyphs. These must be top-level
    <alias> elements: nesting them inside <match> makes fontconfig ignore
    them, which let /etc/fonts/conf.d/65-nonlatin.conf inject MS Gothic /
    NSimSun (serif Song) ahead of HarmonyOS in the fallback list.

    <prefer> inserts HarmonyOS *after* the families already prepended by
    50-default.conf (Iosevka Custom / Lucida Sans), so Latin text keeps
    using those and HarmonyOS is only reached for glyphs they lack (CJK).
  -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>HarmonyOS Sans SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>HarmonyOS Sans SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>HarmonyOS Sans SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>HarmonyOS Sans SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
</fontconfig>
